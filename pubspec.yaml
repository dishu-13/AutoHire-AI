name: smart_job_assistant
description: Production-ready Flutter Android app for job discovery, AI resume tailoring, and application tracking.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cloud_firestore: ^6.3.0
  file_picker: ^11.0.2
  firebase_auth: ^6.4.0
  firebase_core: ^4.7.0
  http: ^1.6.0
  intl: ^0.20.2
  pdf: ^3.12.0
  printing: ^5.14.3
  provider: ^6.1.5+1
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  xml: ^6.6.1
  archive: ^4.0.9
  google_sign_in: ^7.2.0
  syncfusion_flutter_pdf: any
  google_mlkit_text_recognition: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
